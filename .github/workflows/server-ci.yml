name: WorldServer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  worldserver-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF local tool
        working-directory: server/WorldServer
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore server/WorldServer/WorldServer.csproj

      - name: Build
        run: dotnet build server/WorldServer/WorldServer.csproj --configuration Release --no-restore

      - name: Publish smoke artifact
        run: >
          dotnet publish server/WorldServer/WorldServer.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/WorldServer

      - name: Upload WorldServer artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorldServer-linux
          path: artifacts/WorldServer
          if-no-files-found: error
